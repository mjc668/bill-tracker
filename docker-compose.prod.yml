services:
  app:
    image: ghcr.io/mjc668/wombill:${WOMBILL_TAG:-latest}
    container_name: wombill
    restart: unless-stopped
    env_file: .env
    # Locked-down compose path: the image's unprivileged user (10001) owns a
    # named volume out of the box. Unraid installs instead run as root with
    # PUID/PGID; see the Community Applications template.
    user: "10001:10001"
    ports:
      # Localhost only: the host reverse proxy (Caddy/nginx/SWAG) is the
      # public entry point. Point it at this single port for both the UI and
      # /api — the container proxies /api internally.
      - "127.0.0.1:3010:3010"
    volumes:
      - wombill_data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  demo-data:
    image: ghcr.io/mjc668/wombill:${WOMBILL_TAG:-latest}
    container_name: wombill-demo-data
    profiles: ["demo"]
    depends_on:
      app:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/backend/.venv/bin/python", "/app/demo/seed.py"]
    environment:
      SEED_BASE_URL: "http://app:3010/api"
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  wombill_data:
