<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Platybill platypus">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <path d="M0 0H18M0 0V18" stroke="#4a3325" stroke-width="2.5"/>
    </pattern>
    <mask id="frontweb">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="216" cy="489" r="12" fill="#000"/>
      <circle cx="250" cy="486" r="12" fill="#000"/>
    </mask>
    <mask id="hindweb">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="344" cy="461" r="8" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- front webbed flipper -->
  <path d="M240 390C214 416 194 448 190 468c-3 15 14 24 36 21 30-4 58-15 58-33 0-22-20-48-32-62z" fill="#5f4433" mask="url(#frontweb)"/>
  <!-- hind webbed foot -->
  <path d="M352 404c-14 16-24 34-24 46 0 12 14 16 28 12 16-4 24-16 20-30-4-12-12-22-18-28z" fill="#5f4433" mask="url(#hindweb)"/>
  <!-- leathery paddle tail -->
  <g transform="rotate(-14 390 346)">
    <ellipse cx="390" cy="346" rx="88" ry="46" fill="#5f4433"/>
    <ellipse cx="390" cy="346" rx="88" ry="46" fill="url(#hatch)"/>
    <ellipse cx="390" cy="346" rx="86" ry="44" fill="none" stroke="#4a3325" stroke-width="3"/>
  </g>
  <!-- body -->
  <ellipse cx="286" cy="332" rx="156" ry="104" fill="#7b5b45"/>
  <!-- head -->
  <circle cx="172" cy="258" r="92" fill="#7b5b45"/>
  <!-- duck bill -->
  <rect x="28" y="268" width="164" height="62" rx="31" fill="#4a565e"/>
  <path d="M44 312q62 16 132 4" fill="none" stroke="#39434a" stroke-width="9" stroke-linecap="round"/>
  <circle cx="70" cy="292" r="5" fill="#39434a"/>
  <circle cx="106" cy="286" r="5" fill="#39434a"/>
  <circle cx="84" cy="306" r="4" fill="#39434a"/>
  <!-- eye -->
  <circle cx="170" cy="234" r="14" fill="#241a15"/>
  <circle cx="175" cy="228" r="5" fill="#f5f1ee"/>
</svg>
