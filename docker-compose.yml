services:
  app:
    image: wombill:latest
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-dev}
        NEXT_PUBLIC_SESSION_HEARTBEAT_SECONDS: ${NEXT_PUBLIC_SESSION_HEARTBEAT_SECONDS:-180}
    container_name: wombill
    restart: unless-stopped
    env_file: .env
    # Run as the image's unprivileged user: the entrypoint skips PUID/PGID
    # handling when it is not root. Unraid installs run as root and use
    # PUID/PGID instead.
    user: "10001:10001"
    ports:
      # Dev convenience: bound on all interfaces. Production
      # (docker-compose.prod.yml) binds to 127.0.0.1 only, behind a proxy.
      - "3010:3010"
    volumes:
      - wombill_data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  demo-data:
    image: wombill:latest
    container_name: wombill-demo-data
    profiles: ["demo"]
    depends_on:
      app:
        condition: service_healthy
    restart: "no"
    # Same image, different role: seed demo data through the public API.
    entrypoint: ["/backend/.venv/bin/python", "/app/demo/seed.py"]
    environment:
      SEED_BASE_URL: "http://app:3010/api"
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  wombill_data:
